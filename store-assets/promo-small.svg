<!--
  Chrome ウェブストアの小プロモタイル（440x280）の元データ。
  ストアの推奨に合わせて文字を入れず、アイコンと同じ字形だけで見せる。
  https://developer.chrome.com/docs/webstore/images
-->
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2230" />
      <stop offset="1" stop-color="#0a0c11" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)" />
  <rect width="440" height="280" fill="url(#glow)" />
  <g transform="translate(220 140) scale(14) translate(-7.875 -8)">
    <path fill="#fff" d="M3.75 3 L8.75 8 L3.75 13 L2 11.25 L5.25 8 L2 4.75 Z M8.25 11 H13.75 V13 H8.25 Z" />
  </g>
</svg>
