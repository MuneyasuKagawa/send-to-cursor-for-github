<!--
  Chrome ウェブストアのマーキープロモタイル（1400x560）の元データ。
  小タイルと同じ配色。横長でも中心が空かないよう、字形を大きく置く。
  https://developer.chrome.com/docs/webstore/images
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2230" />
      <stop offset="1" stop-color="#0a0c11" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1400" height="560" fill="url(#bg)" />
  <rect width="1400" height="560" fill="url(#glow)" />
  <g transform="translate(700 280) scale(40) translate(-7.875 -8)">
    <path fill="#fff" d="M3.75 3 L8.75 8 L3.75 13 L2 11.25 L5.25 8 L2 4.75 Z M8.25 11 H13.75 V13 H8.25 Z" />
  </g>
</svg>
