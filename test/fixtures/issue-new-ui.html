    - Rails 版のクラス（.js-comment / reactions-menu / .js-comment-body など）が一切無い
    - 本文は [data-testid="issue-body"]、コメントは
      [data-testid="comment-viewer-outer-box-<GraphQL のノード ID>"]
    - 「Copy Markdown」が React のメニュー項目になり、DOM から原文が読めない。
      代わりに埋め込みデータ（下部の script）が本文とコメントの原文を持つ。
    - ボタンの挿入先になる絵文字リアクションは
      button[class*="ReactionViewerAnchor-module__ReactionViewerAnchorButton"]

  クラス名の末尾のハッシュは CSS モジュールの生成物で、GitHub のデプロイごとに変わる。
-->
