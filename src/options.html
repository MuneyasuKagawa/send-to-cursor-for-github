<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>GitHub Cursor Link の設定</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>GitHub Cursor Link</h1>

      <section>
        <h2>リンクの開き方</h2>
        <label class="radio">
          <input type="radio" name="linkMode" value="protocol" />
          <span>
            <strong><code>cursor://</code> で直接開く</strong>
            <small>Cursor アプリを直接起動します。通常はこちら。</small>
          </span>
        </label>
        <label class="radio">
          <input type="radio" name="linkMode" value="web" />
          <span>
            <strong><code>https://cursor.com/link/</code> を経由する</strong>
            <small>
              直接起動が Chrome にブロックされる場合の代替。いったん cursor.com を開いてから
              Cursor に渡します。
            </small>
          </span>
        </label>
      </section>

      <section>
        <h2>ボタンのラベル</h2>
        <label class="checkbox">
          <input type="checkbox" id="showLabel" />
          <span>
            <strong>ラベルを表示する</strong>
            <small>
              オフにするとアイコンだけのボタンになります。入力済みのラベルはスクリーンリーダー
              向けの名前として引き続き使われます。
            </small>
          </span>
        </label>
        <input type="text" id="buttonLabel" maxlength="20" />
      </section>

      <section>
        <h2>ボタンを付ける対象</h2>
        <p class="hint">
          対象ごとに、有効にするかどうかと Cursor に渡すプロンプトを設定できます。
          プロンプトは、値が取得できなかったプレースホルダーを含む行がまるごと削除され、
          中身が空になった見出しも一緒に削除されます。
        </p>
        <div id="targets"></div>
      </section>

      <div class="actions">
        <button id="reset" type="button">すべてのプロンプトを既定値に戻す</button>
        <span class="hint">変更は自動で保存されます。</span>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
