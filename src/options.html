<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Send to Cursor for GitHub</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Send to Cursor for GitHub</h1>

      <!-- タブと対象パネルは TARGETS から options.js が組み立てる -->
      <div class="tabs" id="tabs" role="tablist"></div>

      <div id="panels">
        <section
          id="panel-general"
          class="panel"
          role="tabpanel"
          aria-labelledby="tab-general"
          hidden
        >
          <section class="field">
            <h2 id="languageTitle" data-i18n="options.language.title"></h2>
            <p class="hint" data-i18n="options.language.hint"></p>
            <select id="language" aria-labelledby="languageTitle">
              <option value="ja">日本語</option>
              <option value="en">English</option>
            </select>
          </section>

          <section class="field">
            <h2 data-i18n="options.linkMode.title"></h2>
            <label class="radio">
              <input type="radio" name="linkMode" value="protocol" />
              <span>
                <strong data-i18n="options.linkMode.protocol.title"></strong>
                <small data-i18n="options.linkMode.protocol.hint"></small>
              </span>
            </label>
            <label class="radio">
              <input type="radio" name="linkMode" value="web" />
              <span>
                <strong data-i18n="options.linkMode.web.title"></strong>
                <small data-i18n="options.linkMode.web.hint"></small>
              </span>
            </label>
          </section>

          <section class="field">
            <h2 id="buttonLabelTitle" data-i18n="options.label.title"></h2>
            <label class="toggle">
              <input type="checkbox" id="showLabel" role="switch" />
              <span>
                <strong data-i18n="options.label.show"></strong>
                <small data-i18n="options.label.hint"></small>
              </span>
            </label>
            <input type="text" id="buttonLabel" maxlength="20" aria-labelledby="buttonLabelTitle" />
          </section>

          <!-- まとめて戻す操作は、めったに使わず取り消せないので一般タブの末尾に置く -->
          <section class="field">
            <h2 data-i18n="options.reset.title"></h2>
            <p class="hint" data-i18n="options.reset.hint"></p>
            <button id="reset" type="button" class="danger" data-i18n="options.reset.all"></button>
          </section>
        </section>
      </div>
    </main>

    <!-- 保存の結果。文字が入っているときだけ出る（options.css の #status:empty） -->
    <p id="status" role="status" aria-live="polite"></p>

    <script src="i18n.js"></script>
    <script src="locales/ja.js"></script>
    <script src="locales/en.js"></script>
    <script src="config.js"></script>
    <script src="options.js"></script>
  </body>
</html>
